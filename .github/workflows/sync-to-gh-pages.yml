name: Sync data to gh-pages

# 当main分支的shared-data.json或index.json更新时触发
on:
  push:
    branches:
      - main
    paths:
      - 'shared-data.json'
      - 'index.json'
      - 'upload-data.html'
      - 'index-new.html'

# 显式声明权限，允许推送
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to gh-pages
        run: |
          # 拉取远程最新gh-pages，避免与手动同步的提交产生冲突
          git fetch origin gh-pages
          git checkout gh-pages

          # 本地gh-pages对齐到远程最新（工作流为全新clone，无本地独有提交）
          git reset --hard origin/gh-pages

          # 从main分支复制关键文件
          git checkout main -- shared-data.json index.json upload-data.html index-new.html

          # 提交并推送（基于远程最新，应为fast-forward）
          git add shared-data.json index.json upload-data.html index-new.html
          git commit -m "sync: Auto-sync from main branch" || echo "no changes to commit"
          git push origin gh-pages

      - name: Verify sync
        run: |
          git log --oneline -3
          echo "✅ Sync completed successfully"